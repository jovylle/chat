# Chat Assistant Box Netlify Configuration
[build]
  command = "# no build command"
  functions = "netlify/functions"
  publish = "public"

# Environment variables (set these in Netlify dashboard)
[build.environment]
  NODE_VERSION = "18"

# Function configuration
[functions]
  # `chat` is a v2 streaming function (ESM, `chat.mjs`). It returns a
  # ReadableStream of SSE tokens. Flash-tier models emit their first byte
  # quickly, so the default timeout is fine; raise it here if longer
  # completions are ever needed (paid plans support up to 26s).
  # [functions."chat"]
  #   timeout = 26

# Legacy host redirects
[[redirects]]
  from = "https://quickchatgpt.uft1.com/*"
  to = "https://chat.uft1.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://gptfree.uft1.com/*"
  to = "https://chat.uft1.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://chatgpt.uft1.com/*"
  to = "https://chat.uft1.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://quickchatgpt.netlify.app/*"
  to = "https://chat.uft1.com/:splat"
  status = 301
  force = true

# Redirect rules for SPA behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"

# Cache static assets
[[headers]]
  for = "/prism.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/prism.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Function-specific headers
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
